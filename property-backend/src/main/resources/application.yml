spring:
  datasource:
    url: ${DB_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres?currentSchema=property_mgmt}}
    username: ${DB_USER:${SPRING_DATASOURCE_USERNAME:postgres}}
    password: ${DB_PASS:${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:admin}}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000

  flyway:
    enabled: true
    locations: classpath:db/migration
    create-schemas: true
    default-schema: property_mgmt
    schemas: property_mgmt,public
    baseline-on-migrate: true
    validate-on-migrate: false

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: property_mgmt

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 100MB

  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false

  web:
    locale: en
    locale-resolver: accept-header

jwt:
  secret: ${JWT_SECRET:PropertyManagementSecretKey2024VeryLongAndSecureKeyForJWT}
  expiration: 86400000       # 24 hours
  refresh-expiration: 604800000  # 7 days

tenant:
  portal:
    default-password: ${USER_DEFAULT_PASSWORD:12345}

user:
  default:
    password: ${USER_DEFAULT_PASSWORD:12345}

property:
  late-fee:
    grace-period-days: 3
    late-fee-percentage: 5
    late-fee-fixed-amount: 0

file:
  upload-dir: ${UPLOAD_DIR:D:/files}
  base-url: ${FILE_BASE_URL:http://localhost:8081}

server:
  port: 8081
  servlet:
    context-path: /api/v1

logging:
  level:
    com.propertymanagement: INFO
    org.springframework.security: WARN
    org.flywaydb: INFO
    org.hibernate.SQL: WARN
