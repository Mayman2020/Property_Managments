<header class="topbar">
  <div class="topbar-start">
    <button class="tb-action-btn topbar-toggle" (click)="sidebarToggle.emit()" [matTooltip]="'TOPBAR.TOGGLE_MENU' | translate">
      <span class="material-icons">{{ sidebarCollapsed ? 'menu_open' : 'menu' }}</span>
    </button>

  </div>

  <div class="topbar-end">
    <div class="tb-clock" aria-live="off">
      <span class="material-icons">schedule</span>
      <span>{{ clockText }}</span>
    </div>

    <app-estate-lov-select
      *ngIf="showPropertySelector()"
      cssClass="estate-lov-select tb-property-scope-field"
      [label]="'TOPBAR.PROPERTY_SCOPE'"
      [options]="propertyLovOptions"
      [(ngModel)]="selectedPropertyId"
      (ngModelChange)="onPropertyScopeChange($event)">
    </app-estate-lov-select>

    <button class="tb-action-btn" [matTooltip]="'TOPBAR.LANGUAGE' | translate" [matMenuTriggerFor]="langMenu">
      <img class="flag" [src]="activeLanguage.flagUrl" [attr.alt]="languageLabel(activeLanguage)">
      <span class="lang-name">{{ languageNativeLabel(activeLanguage) }}</span>
    </button>
    <mat-menu #langMenu="matMenu">
      <button mat-menu-item *ngFor="let lang of languages" (click)="switchLang(lang)">
        <img class="flag" [src]="lang.flagUrl" [attr.alt]="languageLabel(lang)">
        <span>{{ languageNativeLabel(lang) }}</span>
      </button>
    </mat-menu>

    <button class="tb-action-btn" (click)="toggleTheme()" [matTooltip]="((theme.isDark$ | async) ? ('TOPBAR.LIGHT_MODE' | translate) : ('TOPBAR.DARK_MODE' | translate))">
      <span class="material-icons">{{ (theme.isDark$ | async) ? 'light_mode' : 'dark_mode' }}</span>
    </button>

    <button class="tb-action-btn" [matMenuTriggerFor]="roleMenu" [matTooltip]="'ROLE.' + (auth.getRole() || '') | translate">
      <span class="material-icons">manage_accounts</span>
      <span class="lang-name" *ngIf="roleKey">{{ roleKey | translate }}</span>
    </button>
    <mat-menu #roleMenu="matMenu">
      <button mat-menu-item *ngFor="let role of switchableRoles" (click)="switchRole(role)" [disabled]="isRoleActive(role)">
        <span class="material-icons">{{ isRoleActive(role) ? 'check_circle' : 'radio_button_unchecked' }}</span>
        <span>{{ ('ROLE.' + role) | translate }}</span>
      </button>
    </mat-menu>

    <button
      type="button"
      class="tb-action-btn tb-notify-btn"
      (click)="openNotificationsInbox()"
      [matTooltip]="'NOTIFICATIONS.TITLE' | translate"
      [attr.aria-label]="'NOTIFICATIONS.TITLE' | translate">
      <span class="material-icons">notifications</span>
      <span *ngIf="unreadCount > 0" class="tb-notify-count">{{ unreadCount }}</span>
    </button>

    <button class="tb-user-btn" [matMenuTriggerFor]="userMenu">
      <div class="tb-avatar" *ngIf="!currentUser?.profileImageUrl">{{ currentUser?.initials || 'U' }}</div>
      <img class="tb-avatar tb-avatar-img" *ngIf="currentUser?.profileImageUrl" [src]="currentUser?.profileImageUrl" [attr.alt]="'PROFILE.AVATAR_ALT' | translate">
      <span class="tb-user-copy">
        <span class="tb-user-name">{{ currentUserDisplayName || '-' }}</span>
        <span class="tb-user-role" *ngIf="roleKey">{{ roleKey | translate }}</span>
      </span>
    </button>

    <mat-menu #userMenu="matMenu" class="tb-user-menu">
      <div class="user-menu-header">
        <div class="user-menu-avatar" *ngIf="!currentUser?.profileImageUrl">{{ currentUser?.initials || 'U' }}</div>
        <img class="user-menu-avatar user-menu-avatar-img" *ngIf="currentUser?.profileImageUrl" [src]="currentUser?.profileImageUrl" [attr.alt]="'PROFILE.AVATAR_ALT' | translate">
        <div class="user-menu-copy">
          <strong>{{ currentUserDisplayName || '-' }}</strong>
          <span class="user-menu-role" *ngIf="roleKey">{{ roleKey | translate }}</span>
          <span class="user-menu-email">{{ currentUser?.email }}</span>
        </div>
      </div>
      <mat-divider></mat-divider>
      <button mat-menu-item [routerLink]="profileRoute()">
        <span class="material-icons">person</span>
        {{ 'NAV.PROFILE' | translate }}
      </button>
      <button mat-menu-item (click)="logout()">
        <span class="material-icons">logout</span>
        {{ 'AUTH.LOGOUT' | translate }}
      </button>
    </mat-menu>
  </div>
</header>
